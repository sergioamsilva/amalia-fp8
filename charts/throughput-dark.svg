<text x="388.8" y="84" font-size="12" font-weight="600" fill="#ffffff">12.2 tok/s</text>
<text x="388.8" y="97" font-size="10" fill="#8a8880">18 GB on disk</text>
<text x="118" y="124" font-size="12" text-anchor="end" fill="#c3c2b7">FP8 W8A8</text>
