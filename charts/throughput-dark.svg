<svg xmlns="http://www.w3.org/2000/svg" width="760" height="232" viewBox="0 0 760 232" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<rect width="760" height="232" fill="#1a1a19"/>
<text x="24" y="30" font-size="15" font-weight="600" fill="#ffffff">Throughput on a DGX Spark, single stream</text>
<text x="24" y="50" font-size="12" fill="#c3c2b7">Higher is better. Halving the weight bytes nearly doubles the tokens per second.</text>
